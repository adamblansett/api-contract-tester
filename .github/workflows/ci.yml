name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run automated tests
        run: npm run test

      - name: Build package
        run: npm run build

      - name: CLI smoke test
        run: |
          node ./dist/cli/index.js --version
          node ./dist/cli/index.js --help
          node ./dist/cli/index.js validate ./examples/users-api.json
          node ./dist/cli/index.js validate ./examples/auth-flow.json
          node ./dist/cli/index.js validate ./examples/schema-validation.json
